# GBS Loan Management System — 100% Free-Tier Render.com Blueprint
# Free Cloudhost Target: https://gbs-loan-system.onrender.com (Render auto-assigns unique suffix if taken)
# Company Contact / Operations Notification Email: gabosei48@gmail.com

databases:
  - name: gbs-loan-db
    databaseName: gbs_loan_db
    user: gbs_admin
    plan: free
    region: frankfurt

services:
  - type: keyvalue
    name: gbs-loan-redis
    plan: free
    region: frankfurt
    ipAllowList: []

  - type: web
    name: gbs-loan-system
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm --prefix Backend install --include=dev && npm --prefix Backend run db:generate && npm --prefix Frontend install --include=dev && npm --prefix Frontend run build
    startCommand: npm --prefix Backend run db:migrate:prod && npm --prefix Backend run db:seed && npm --prefix Backend start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: METRICS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: gbs-loan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gbs-loan-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEVELOPER_JWT_SECRET
        generateValue: true
      - key: VOICE_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENCRYPTION_IV
        generateValue: true
      - key: DEV_BOOTSTRAP_EMAIL
        value: gabosei48@gmail.com
      - key: EMAIL_FROM
        value: gabosei48@gmail.com
      - key: CORS_ORIGIN
        value: https://*.onrender.com


