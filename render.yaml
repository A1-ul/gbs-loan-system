# GBS Loan Management System — Exclusive Render.com Infrastructure Blueprint
# Company Contact / Operations Notification Email: gabosei48@gmail.com

databases:
  - name: gbs-loan-db
    databaseName: gbs_loan_db
    user: gbs_admin
    plan: basic-256mb
    region: frankfurt

services:
  - type: keyvalue
    name: gbs-loan-redis
    plan: free
    region: frankfurt
    ipAllowList: []

  - type: web
    name: gbs-loan-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: Backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node prisma/seed.js && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: METRICS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: gbs-loan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gbs-loan-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEVELOPER_JWT_SECRET
        generateValue: true
      - key: VOICE_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENCRYPTION_IV
        generateValue: true
      - key: DEV_BOOTSTRAP_EMAIL
        value: developer@gbsloan.com
      - key: EMAIL_FROM
        value: gabosei48@gmail.com
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: gbs-loan-frontend
          property: host

  - type: worker
    name: gbs-loan-worker
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: Backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/jobs/workerRunner.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gbs-loan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gbs-loan-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: gbs-loan-api
          envVarKey: JWT_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: gbs-loan-api
          envVarKey: JWT_REFRESH_SECRET
      - key: DEVELOPER_JWT_SECRET
        fromService:
          type: web
          name: gbs-loan-api
          envVarKey: DEVELOPER_JWT_SECRET
      - key: VOICE_AUTH_SECRET
        fromService:
          type: web
          name: gbs-loan-api
          envVarKey: VOICE_AUTH_SECRET
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: gbs-loan-api
          envVarKey: ENCRYPTION_KEY
      - key: ENCRYPTION_IV
        fromService:
          type: web
          name: gbs-loan-api
          envVarKey: ENCRYPTION_IV
      - key: EMAIL_FROM
        value: gabosei48@gmail.com

  - type: web
    name: gbs-loan-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: gbs-loan-api
          property: host
      - key: VITE_APP_NAME
        value: GBS Loan Management System
      - key: VITE_ENABLE_VOICE_AUTH
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

