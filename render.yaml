# GBS Loan Management System — Exclusive Render.com Infrastructure Blueprint
# Company Contact / Operations Notification Email: gabosei48@gmail.com

databases:
  - name: gbs-loan-db
    databaseName: gbs_loan_db
    user: gbs_admin
    plan: basic-256mb
    region: frankfurt

services:
  - type: keyvalue
    name: gbs-loan-redis
    plan: free
    region: frankfurt
    ipAllowList: []

  - type: web
    name: gbs-loan-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: Backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: gbs-loan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gbs-loan-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEVELOPER_JWT_SECRET
        generateValue: true
      - key: MAIL_FROM
        value: gabosei48@gmail.com
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: gbs-loan-frontend
          property: host

  - type: worker
    name: gbs-loan-worker
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: Backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/jobs/workerRunner.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gbs-loan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gbs-loan-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: gbs-loan-api
          envVarKey: JWT_SECRET
      - key: DEVELOPER_JWT_SECRET
        fromService:
          type: web
          name: gbs-loan-api
          envVarKey: DEVELOPER_JWT_SECRET
      - key: MAIL_FROM
        value: gabosei48@gmail.com

  - type: web
    name: gbs-loan-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://gbs-loan-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gbs-loan-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

