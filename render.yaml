# GBS Loan Management System — 100% Free-Tier Render.com Blueprint (Web-Only Quota Safe)
# Avoids Render's 1-free-Postgres + 1-free-KeyValue workspace limit by:
#   1. Supplying DATABASE_URL (from existing Render Postgres or free Neon Postgres) via sync: false
#   2. Running built-in zero-config in-memory cache/queue fallback when REDIS_URL is omitted
# Company Contact / Operations Notification Email: gabosei48@gmail.com

services:
  - type: web
    name: gbs-loan-system
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: METRICS_ENABLED
        value: "false"
      - key: SEED_BASELINE_INSTITUTIONS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEVELOPER_JWT_SECRET
        generateValue: true
      - key: VOICE_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENCRYPTION_IV
        generateValue: true
      - key: DEV_BOOTSTRAP_EMAIL
        value: gabosei48@gmail.com
      - key: EMAIL_FROM
        value: gabosei48@gmail.com
      - key: CORS_ORIGIN
        value: https://*.onrender.com
